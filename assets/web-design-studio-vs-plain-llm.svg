<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Web Design Studio versus asking an LLM alone</title>
  <desc id="desc">A split-path diagram showing how Web Design Studio turns one brief into a distinctive, production-proven website.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#111521" flood-opacity=".12"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#111521" flood-opacity=".11"/>
    </filter>
    <marker id="arrowInk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l9 5-9 5" fill="none" stroke="#111521" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowLime" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l9 5-9 5" fill="none" stroke="#caff2d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#caff2d"/>
      <stop offset="1" stop-color="#8dff71"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#111521" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#f4f2e9"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- masthead -->
  <g transform="translate(74 58)">
    <rect width="48" height="48" rx="2" fill="#caff2d" stroke="#111521" stroke-width="1.5"/>
    <path d="M14 35V13h20v22M19 35V18h10v17" fill="none" stroke="#111521" stroke-width="1.8"/>
    <text x="68" y="34" fill="#111521" font-family="Georgia, 'Times New Roman', serif" font-size="34">Web Design Studio</text>
    <text x="1450" y="29" text-anchor="end" fill="#59606b" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2.7">THE SKILL ADVANTAGE · 01</text>
  </g>
  <line x1="74" y1="126" x2="1526" y2="126" stroke="#111521" stroke-opacity=".22"/>

  <!-- headline -->
  <text x="74" y="208" fill="#111521" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="400">One prompt. Two outcomes.</text>
  <line x1="76" y1="226" x2="650" y2="226" stroke="#caff2d" stroke-width="7"/>
  <text x="76" y="265" fill="#59606b" font-family="Arial, Helvetica, sans-serif" font-size="21">A model can write a page. The skill gives it taste, a production system, and proof.</text>

  <!-- shared prompt -->
  <g filter="url(#smallShadow)" transform="translate(455 306)">
    <rect width="690" height="92" rx="46" fill="#fffef8" stroke="#111521" stroke-width="1.2"/>
    <circle cx="48" cy="46" r="26" fill="#caff2d"/>
    <text x="48" y="52" text-anchor="middle" fill="#111521" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">1</text>
    <text x="91" y="37" fill="#59606b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">THE SAME BRIEF</text>
    <text x="91" y="63" fill="#111521" font-family="Georgia, 'Times New Roman', serif" font-size="21">“Build an immersive launch page for my product.”</text>
  </g>

  <!-- branching arrows -->
  <path d="M705 398C640 438 492 433 400 470" fill="none" stroke="#111521" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#arrowInk)"/>
  <path d="M895 398C960 438 1108 433 1200 470" fill="none" stroke="#111521" stroke-width="2.2" marker-end="url(#arrowInk)"/>

  <!-- plain LLM column -->
  <g transform="translate(74 476)">
    <rect width="678" height="406" rx="30" fill="#e8e7e0" stroke="#111521" stroke-opacity=".22"/>
    <text x="34" y="45" fill="#59606b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">ASKING AN LLM ALONE</text>
    <text x="34" y="91" fill="#111521" font-family="Georgia, 'Times New Roman', serif" font-size="37">A plausible first draft</text>
    <line x1="34" y1="106" x2="318" y2="106" stroke="#111521" stroke-width="2"/>

    <g transform="translate(34 140)" font-family="Arial, Helvetica, sans-serif">
      <g><circle cx="13" cy="13" r="12" fill="#d5d4cc"/><text x="13" y="18" text-anchor="middle" font-size="15" fill="#717680">×</text><text x="41" y="19" font-size="18" fill="#303540">Generic visual defaults</text></g>
      <g transform="translate(0 48)"><circle cx="13" cy="13" r="12" fill="#d5d4cc"/><text x="13" y="18" text-anchor="middle" font-size="15" fill="#717680">×</text><text x="41" y="19" font-size="18" fill="#303540">Motion added without choreography</text></g>
      <g transform="translate(0 96)"><circle cx="13" cy="13" r="12" fill="#d5d4cc"/><text x="13" y="18" text-anchor="middle" font-size="15" fill="#717680">×</text><text x="41" y="19" font-size="18" fill="#303540">Desktop happy path only</text></g>
      <g transform="translate(0 144)"><circle cx="13" cy="13" r="12" fill="#d5d4cc"/><text x="13" y="18" text-anchor="middle" font-size="15" fill="#717680">×</text><text x="41" y="19" font-size="18" fill="#303540">Quality depends on every prompt</text></g>
    </g>

    <g transform="translate(391 137)">
      <rect width="244" height="180" rx="18" fill="#faf9f3" stroke="#111521" stroke-opacity=".25"/>
      <rect x="18" y="20" width="91" height="11" rx="5.5" fill="#c7c6bf"/>
      <rect x="18" y="44" width="170" height="7" rx="3.5" fill="#deddd6"/>
      <rect x="18" y="63" width="132" height="7" rx="3.5" fill="#deddd6"/>
      <rect x="18" y="88" width="208" height="58" rx="10" fill="#d9d8d1"/>
      <rect x="18" y="157" width="72" height="10" rx="5" fill="#bdbcb5"/>
      <circle cx="214" cy="25" r="7" fill="#bdbcb5"/>
    </g>
    <text x="34" y="371" fill="#717680" font-family="Arial, Helvetica, sans-serif" font-size="15">OUTPUT · attractive enough, difficult to trust</text>
  </g>

  <!-- skill system column -->
  <g filter="url(#shadow)" transform="translate(790 476)">
    <rect width="736" height="406" rx="30" fill="#111521" stroke="#111521"/>
    <rect x="1" y="1" width="734" height="404" rx="29" fill="none" stroke="#caff2d" stroke-opacity=".36"/>
    <text x="34" y="45" fill="#caff2d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">WITH WEB DESIGN STUDIO</text>
    <text x="34" y="91" fill="#fffef8" font-family="Georgia, 'Times New Roman', serif" font-size="37">A directed production system</text>
    <line x1="34" y1="106" x2="402" y2="106" stroke="#caff2d" stroke-width="3"/>

    <!-- system pipeline -->
    <g font-family="Arial, Helvetica, sans-serif" transform="translate(34 142)">
      <g>
        <rect width="142" height="70" rx="18" fill="#1d2331" stroke="#caff2d" stroke-opacity=".55"/>
        <text x="16" y="27" fill="#caff2d" font-size="11" font-weight="700" letter-spacing="1.2">01 · DIRECTION</text>
        <text x="16" y="50" fill="#fffef8" font-size="15">Taste + identity</text>
      </g>
      <path d="M148 35h32" stroke="#caff2d" stroke-width="1.5" marker-end="url(#arrowLime)"/>
      <g transform="translate(187)">
        <rect width="142" height="70" rx="18" fill="#1d2331" stroke="#caff2d" stroke-opacity=".55"/>
        <text x="16" y="27" fill="#caff2d" font-size="11" font-weight="700" letter-spacing="1.2">02 · MOTION</text>
        <text x="16" y="50" fill="#fffef8" font-size="15">Scroll grammar</text>
      </g>
      <path d="M335 35h32" stroke="#caff2d" stroke-width="1.5" marker-end="url(#arrowLime)"/>
      <g transform="translate(374)">
        <rect width="142" height="70" rx="18" fill="#1d2331" stroke="#caff2d" stroke-opacity=".55"/>
        <text x="16" y="27" fill="#caff2d" font-size="11" font-weight="700" letter-spacing="1.2">03 · BUILD</text>
        <text x="16" y="50" fill="#fffef8" font-size="15">3D + fallbacks</text>
      </g>
      <path d="M522 35h32" stroke="#caff2d" stroke-width="1.5" marker-end="url(#arrowLime)"/>
      <g transform="translate(561)">
        <rect width="107" height="70" rx="18" fill="url(#signal)"/>
        <text x="15" y="27" fill="#111521" font-size="11" font-weight="700" letter-spacing="1.2">04 · PROVE</text>
        <text x="15" y="50" fill="#111521" font-size="15" font-weight="700">Browser QA</text>
      </g>
    </g>

    <!-- outcome proof -->
    <g transform="translate(34 244)" font-family="Arial, Helvetica, sans-serif">
      <rect width="668" height="92" rx="20" fill="#f4f2e9"/>
      <g transform="translate(18 19)">
        <text y="13" fill="#59606b" font-size="10" font-weight="700" letter-spacing="1.5">DISTINCTIVE</text>
        <text y="41" fill="#111521" font-family="Georgia, 'Times New Roman', serif" font-size="24">Brand-led</text>
      </g>
      <line x1="168" y1="18" x2="168" y2="74" stroke="#111521" stroke-opacity=".16"/>
      <g transform="translate(190 19)">
        <text y="13" fill="#59606b" font-size="10" font-weight="700" letter-spacing="1.5">RESPONSIVE</text>
        <text y="41" fill="#111521" font-family="Georgia, 'Times New Roman', serif" font-size="24">Every viewport</text>
      </g>
      <line x1="390" y1="18" x2="390" y2="74" stroke="#111521" stroke-opacity=".16"/>
      <g transform="translate(412 19)">
        <text y="13" fill="#59606b" font-size="10" font-weight="700" letter-spacing="1.5">RESILIENT</text>
        <text y="41" fill="#111521" font-family="Georgia, 'Times New Roman', serif" font-size="24">Motion with proof</text>
      </g>
    </g>
    <text x="34" y="371" fill="#caff2d" font-family="Arial, Helvetica, sans-serif" font-size="15">OUTPUT · memorable, accessible, performant, verified</text>
  </g>

  <!-- footer proof points -->
  <line x1="74" y1="927" x2="1526" y2="927" stroke="#111521" stroke-opacity=".22"/>
  <g transform="translate(74 954)" font-family="Arial, Helvetica, sans-serif">
    <text fill="#111521" font-size="13" font-weight="700" letter-spacing="1.5">THE COMPOUND EFFECT</text>
    <text x="230" fill="#59606b" font-size="15">Reusable taste</text><circle cx="359" cy="-5" r="4" fill="#caff2d"/>
    <text x="382" fill="#59606b" font-size="15">Purposeful motion</text><circle cx="535" cy="-5" r="4" fill="#caff2d"/>
    <text x="558" fill="#59606b" font-size="15">Production fallbacks</text><circle cx="726" cy="-5" r="4" fill="#caff2d"/>
    <text x="749" fill="#59606b" font-size="15">Five-profile browser proof</text>
    <rect x="1175" y="-23" width="277" height="38" rx="19" fill="#caff2d"/>
    <text x="1313" y="2" text-anchor="middle" fill="#111521" font-size="13" font-weight="700" letter-spacing="1">DESIGN THAT SURVIVES SHIPPING</text>
  </g>
</svg>
