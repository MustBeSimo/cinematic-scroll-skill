# Cinematic Scroll — quality gate in CI.
#
# The whole pitch is that cinematic taste is a number you can block on. This
# workflow proves it: every push and PR runs `cinematic-doctor` over the bundled
# examples and builds the React Three Fiber / WebXR flagship (Mode B). A red X
# here means a build dropped below the craft bar or stopped compiling.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  craft-contract:
    name: cinematic-doctor (quality gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The gate must be able to fail: good fixture passes, bad fixture fails.
      - name: Doctor self-test
        run: node tools/cinematic-doctor/cli.mjs --selftest

      # Design-contract invariants (all zero-dependency — pure node + git).
      - name: Design-token contract
        run: node tools/check-tokens.mjs
      - name: Theme contract (11 systems)
        run: node tools/check-themes.mjs
      - name: Docs ↔ reality (dead links + stale strings)
        run: node tools/check-links.mjs
      - name: Consistency (version / secrets / token determinism)
        run: node tools/check-consistency.mjs
      - name: Skill pointer stubs in sync (.codex / .cursor)
        run: node tools/skill-sync.mjs --check
      - name: Component library (doctor ≥80 each)
        run: for f in components/mode-a/*.html; do node tools/cinematic-doctor/cli.mjs "$f" --min 80 --quiet || exit 1; done
      - name: Evals (golden fixtures + trigger-set shape)
        run: node evals/run.mjs

      # Sweep every web build in the repo (landing pages + examples). Video
      # compositions and test fixtures are skipped automatically. Default
      # threshold is 80; a build under the bar exits non-zero and blocks merge.
      - name: Score all web builds
        run: node tools/cinematic-doctor/cli.mjs .

  flagship-build:
    name: flagship Mode B (R3F + WebXR build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Runtime smoke — its own job because it needs a browser (the gate suite above stays
  # zero-dependency). ubuntu-latest ships Google Chrome; proof:components auto-detects it
  # and SKIPS cleanly if absent, so this never becomes a flaky blocker. Catches runtime
  # errors in the self-contained components that the static doctor can't see.
  runtime-proof:
    name: page-proof (component runtime smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (playwright-core)
        run: npm install --no-audit --no-fund
      - name: Runtime-proof the components (browser-gated)
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          export CHROME_PATH
          echo "Using CHROME_PATH=${CHROME_PATH:-<none — step will skip>}"
          npm run proof:components
